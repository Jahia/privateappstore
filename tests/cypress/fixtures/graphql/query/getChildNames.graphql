# Child node names in a chosen workspace.
#
# Used to read a node's j:acl children, which is how Jahia stores access-control entries. Asserting
# on the ACE nodes rather than on hasPermission matters for SEC-366: store-developer still holds
# jcr:write_live at site scope, so a permission probe would answer "yes" whether or not the
# uploader's own owner grant was ever applied. The ACE is the only unambiguous evidence.
query GetChildNames($workspace: Workspace!, $path: String!) {
    jcr(workspace: $workspace) {
        nodeByPath(path: $path) {
            path
            children {
                nodes {
                    name
                }
            }
        }
    }
}
